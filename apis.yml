name: Millimetric
description: >-
  Millimetric is API-first, privacy-respecting web and product analytics for developers,
  indie startups ("vibe coders"), and AI agents. It captures events over a simple REST API
  (/v1/track, /v1/batch, /v1/identify, /v1/query, /v1/stats, /v1/sources), a ~1.8 KB browser
  SDK, and a zero-dependency Node SDK, with a built-in attribution classifier that splits
  paid versus organic social traffic (the Facebook social-vs-paid split). It stores no
  cookies and no raw IPs — GDPR/CCPA compliant, with a /v1/forget right-to-be-forgotten
  endpoint — and ships a first-class hosted Model Context Protocol (MCP) server so AI agents
  emit and query analytics natively. Backed by Seedcamp.
